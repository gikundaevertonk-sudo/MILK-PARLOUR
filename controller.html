<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Parlor | Controller Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <span id="welcomeMsg"></span>
        <button onclick="logout()">Logout</button>
    </nav>

    <main class="dashboard-grid">
        <div class="dashboard-panel">
            <h2>Subscription Status</h2>
            <p>Expiry date: <span id="expiryDate"></span></p>
            <p>Status: <span id="activeStatus"></span></p>

            <label>New expiry date:
                <input type="date" id="newExpiryDate">
            </label>
            <label>
                <input type="checkbox" id="isActiveCheckbox"> Active
            </label>
            <button class="dashboard-btn" onclick="updateSubscription()">Update</button>
            <p id="subMessage"></p>
        </div>

        <div class="dashboard-panel">
            <h2>Clear Closing Balances</h2>
            <p class="section-note">Remove submitted closing data for one shop and an inclusive date range.</p>
            <label for="clearShop">Shop:
                <select id="clearShop"></select>
            </label>
            <div class="filter-controls">
                <label for="clearStartDate">Start date:
                    <input type="date" id="clearStartDate">
                </label>
                <label for="clearEndDate">End date:
                    <input type="date" id="clearEndDate">
                </label>
            </div>
            <button type="button" onclick="clearClosingBalances()">Clear Selected Balances</button>
            <p id="clearMessage"></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="session.js"></script>
    <script src="controller.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Controller Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <span id="welcomeMsg"></span>
        <button onclick="logout()">Logout</button>
    </nav>

    <div class="dashboard-grid">
        <div class="dashboard-panel">
            <h2>Subscription Status</h2>
            <p>Expiry date: <span id="expiryDate"></span></p>
            <p>Status: <span id="activeStatus"></span></p>

            <label>New expiry date:
                <input type="date" id="newExpiryDate">
            </label>
            <label>
                <input type="checkbox" id="isActiveCheckbox"> Active
            </label>
            <button class="dashboard-btn" onclick="updateSubscription()">Update</button>
            <p id="subMessage"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="session.js"></script>
    <script src="controller.js"></script>
</body>
</html>

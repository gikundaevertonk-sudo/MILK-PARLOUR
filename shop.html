<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milk Parlor | Shop Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <span id="welcomeMsg"></span>
        <button onclick="logout()">Logout</button>
    </nav>

    <main class="dashboard-grid">
        <div class="dashboard-panel">
            <h1>Today's Sales Entry</h1>
            <div id="productsContainer"></div>
            <button onclick="saveEntries()">Save</button>
            <p id="saveMessage"></p>

            <section class="shop-closing-details" aria-labelledby="shopClosingHeading">
                <h2 id="shopClosingHeading">Closing Details</h2>
                <div class="closing-entry-grid">
                    <label for="closingMpesa">M-Pesa amount:
                        <input type="number" id="closingMpesa" min="0" step="0.01" placeholder="0.00" oninput="updateClosingMoneyTotal()">
                    </label>
                    <label for="closingNotes">Cash notes:
                        <input type="number" id="closingNotes" min="0" step="0.01" placeholder="0.00" oninput="updateClosingMoneyTotal()">
                    </label>
                    <label for="closingCoins">Cash coins:
                        <input type="number" id="closingCoins" min="0" step="0.01" placeholder="0.00" oninput="updateClosingMoneyTotal()">
                    </label>
                </div>
                <div class="closing-money-summary">
                    <span>Cash total: <strong id="closingCashTotal">0.00</strong></span>
                    <span>Money received: <strong id="closingMoneyTotal">0.00</strong></span>
                    <span hidden>Expected sales: <strong id="closingExpectedTotal">0.00</strong></span>
                    <span hidden>Difference: <strong id="closingDifference">0.00</strong></span>
                </div>
                <h3>Yoghurt Cups</h3>
                <p class="section-note">Enter sealed packs (1 pack = 25 cups) and loose cups left per size.</p>
                <div id="yoghurtClosingRows"></div>
                <button type="button" onclick="saveClosingDetails()">Save Closing Details</button>
                <p id="closingMessage"></p>
            </section>
        </div>
        <div class="dashboard-panel notification-panel" id="notificationPanel">
            <h2>Notifications</h2>
            <ul id="notificationList"></ul>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="session.js"></script>
    <script src="shop.js"></script>
</body>
</html>
